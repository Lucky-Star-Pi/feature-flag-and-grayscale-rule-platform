services:
  postgres:
    image: postgres:16-alpine
    container_name: featureflag-pg
    environment:
      POSTGRES_USER: flaguser
      POSTGRES_PASSWORD: flagpass
      POSTGRES_DB: featureflag
    ports:
      - "5433:5432"
    volumes:
      - D:/Tools/docker-data/featureflag-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flaguser -d featureflag"]
      interval: 3s
      timeout: 5s
      retries: 10
